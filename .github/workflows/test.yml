name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: npm ci + host/config + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Verify pinned toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check package manifest contract
        run: node --test test/package-manifest-contract.test.mjs
      - name: Run real host Config smoke
        run: node --test test/host-config.test.mjs
      - name: Run Config API static rule
        run: node --test test/config-source-rule.test.mjs
      - name: Run redacted route fixtures
        run: node --test test/route-fixtures.test.mjs
      - name: Run full test suite
        run: node --test
      - name: Check host syntax
        shell: bash
        run: |
          for file in lib/index.js lib/client.js lib/fold.js lib/quota.js; do
            node --check "$file"
          done
