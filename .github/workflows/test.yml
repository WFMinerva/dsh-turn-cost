name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: npm ci + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Verify pinned toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the full test suite
        run: npm test
      - name: Check host and client syntax
        run: npm run check
      - name: Check the peer model
        # No --runtime here: CI has no dsh installation, so this validates the
        # declared model (wildcard host peers + exact reviewed dev pins) only.
        # Checking against a real runtime version belongs to the delivery run.
        run: node tools/peer-compat.mjs
